# Copy to config.yaml (gitignored) and edit. Nothing here is a secret, but it is yours to tune.
#
# mode per platform:
#   dry-run  fill the form, screenshot, NEVER submit (the default while developing)
#   prepare  the bot never drives the employer's form. It tailors the resume, computes every answer and the cover
#            letter, writes a copy-ready sheet (answers in form order + the PDF path), and opens the job and the sheet
#            in your NORMAL default browser. You fill and submit by hand, then confirm in the terminal; it is recorded
#            as a manual submission. Needs no --allow-submit (it cannot submit). The default for Lever.
#   assist   fill everything, highlight what is left for you, then wait while YOU click Submit
#   auto     fill and submit without you; falls back to assist if any required field is empty or flagged,
#            or if a CAPTCHA / security-code challenge is actually visible
#
# A real submission (assist or auto) ALSO needs `--allow-submit <the job's canonical URL>` on the command line:
# approval is per job, so a forgotten flag or a pasted wrong URL can only ever produce a dry run.
default_mode: dry-run

platforms:
  greenhouse: {mode: assist}
  lever: {mode: prepare}         # not assist/auto: Lever's anti-bot check rejected a live automated submit (see plan.md)
  linkedin: {mode: assist}       # not supported yet; assist stays the default for LinkedIn and Naukri
  naukri: {mode: assist}
  indeed: {mode: assist}

# Optional: mirror the tracker into a Google Sheet (one row per posting). Leave spreadsheet_id out to skip it.
# Setup: create a Google Cloud project, enable the Google Sheets API, create OAuth client credentials of type
# "Desktop app", save the JSON as credentials.json next to apply.py (gitignored), create an empty sheet with a tab
# named below, paste its id (the long part of its URL) here, then run `python apply.py --sync-sheet` once: it opens a
# Google sign-in and saves token.json (gitignored). After that every run updates its row by itself.
# Columns A-L are the bot's (Date, Status, Mode, Company, Role, Location, URL, Score, Flagged fields, Resume file
# used, Gaps, Notes). Columns M-P are yours (Response, Interview stage, Follow-up date, My notes): the bot never
# writes there, and it finds a row by its URL, so you can sort and filter the sheet freely.
# sheets:
#   spreadsheet_id: ""
#   sheet_name: Applications

# Job discovery (python discover.py): saved searches run through python-jobspy. Each search term is run in each
# location on each site; postings are filtered cheaply (title, age, location, experience asked, duplicates) with no
# Claude calls, saved as "found", and shown as a shortlist for you to approve. JobSpy scrapes public job pages
# (no login); keep the numbers modest, because LinkedIn in particular rate-limits (it blocks around page 10).
discovery:
  search_terms: [backend engineer, software development engineer, python developer, software engineer]
  locations:
    - {name: Bengaluru, query: "Bengaluru, Karnataka, India"}
    - {name: Remote India, query: India, remote: true}
  sites: [indeed, naukri, linkedin]
  max_age_days: 30
  results_per_search: 30          # per site, per term, per location
  country: india                  # JobSpy's country_indeed
  max_min_experience_years: 2     # drop postings whose MINIMUM experience is above this (yours is about 1.8)
  fetch_description: true         # needed for LinkedIn / Naukri text and Naukri's external apply link (1 extra request each)
  delay_between_searches_s: [5, 10]
  # accept_cities: [Bengaluru, Bangalore]   # defaults; also accepted: remote postings located in `country_name`
  # title_include / title_exclude: regexes; see jobbot/discovery.py for the defaults (interns, managers, QA... are dropped)

# Batch runner (python batch.py): prepares the jobs you approved, one at a time. Nothing costs Claude usage until you
# approve a job. Greenhouse is filled using platforms.greenhouse.mode above (assist: you click Submit); Lever and everything
# else get a tailored resume, a cover letter and an answer sheet and become "Ready for you" with their link.
batch:
  delay_between_jobs_s: [60, 180]   # a random wait in this range between jobs
  daily_cap: 10                     # jobs started per day; a job stopped by Claude's usage limit does not count
