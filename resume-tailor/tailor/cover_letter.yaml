# Cover-letter settings (committed: nothing personal here). Edit freely.
# Used by the cover-letter generator (M4) and its guard. Facts never come from writing_samples.txt.

length:
  words_min: 150
  words_max: 250
  paragraphs: 3

# Tone comes from writing_samples.txt (gitignored). These rules tell the prompt how to use it.
style_rules:
  - "Use the writing samples for sentence length and plain wording ONLY: short sentences, polite and direct. Do not take their enthusiasm phrases."
  - "Sound confident and professional, never eager. State intent plainly (\"I'm applying for...\") and show interest through specific connections to the role, not enthusiasm words (no \"love to\", \"excited to\", \"eager to\", \"dream\"). Close simply, for example \"I'd be glad to discuss this further. Thank you for your time.\""
  - "Take TONE ONLY from the samples. Never take facts from them; they are outdated (for example 'recent graduate', or skills no longer listed). Facts come only from the visible resume content."
  - "Do not copy the samples' weaker habits: no long lists of technologies (pick 1-2 concrete achievements with their real numbers instead) and no generic openers."
  - "The first paragraph is at most two sentences: state the role and connect it to your work. Never summarise the job description back to the company."
  - "Connect 1-2 specific JD requirements to 1-2 concrete things from the visible resume bullets (one or two achievements, never a list of three), and give each a plain line on why it matters for this role. Mention the company only using facts from the JD."
  - "Link each achievement to the role naturally, without announcing the link: no 'This matters for your role because...' or 'It fits well with...'. Start no two sentences with the same words."
  - "Stay as close to the job description's meaning as possible; never broaden it (no 'the world's...', global, industry-leading and the like unless the JD says so)."
  - "Never put words in quotation marks. Paraphrase the job description naturally; the exact phrases go only in jd_quotes, for the guard."
  - "Close simply and politely (for example a short thank-you). Never close with 'In an interview, I would like to discuss...'."

# Each letter gets a different style of closing (the one used in the last few letters is skipped), so letters
# sent to different companies do not all end the same way. Edit or add styles freely.
closing_styles:
  - "Offer to share more detail about one of the projects you described, then thank them for reading."
  - "Say you would be glad to talk it through on a call, then thank them for their time."
  - "Say your resume is attached for reference, then thank them."
  - "Say you look forward to hearing from them, then thank them."
  - "Offer to answer any questions about your experience, then thank them for considering your application."
  - "Say you would be happy to hear from them whenever suits, then thank them."
  - "Keep it very short: one sentence of interest in the next steps, then a plain thank you."
  - "Say you would be glad to discuss this further, then thank them for their time."

# The first paragraph states the role and connects it to the candidate's work; it does not summarise the JD.
first_paragraph:
  max_sentences: 2

# How many sentences may contain a number (each is an achievement): the letter describes 1-2, not a list.
achievements:
  max_sentences_with_numbers: 2

# Case-insensitive; a letter containing any of these fails the guard and is regenerated once.
banned_phrases:
  - "I am writing to express"
  - "I'm writing to express"
  - "I hope you're doing well"
  - "I hope you are doing well"
  - "I hope this email finds you well"
  - "I hope this finds you well"
  - "passionate"
  - "thrilled"
  - "leverage"
  - "dynamic team"
  - "great fit"
  - "perfect fit"
  - "team player"
  - "hit the ground running"
  - "results-driven"
  - "detail-oriented"
  - "cutting-edge"
  - "state-of-the-art"
  - "synergy"
  - "go-getter"
  - "for your time and consideration"            # appeared in every sample letter: sounds like a template
  - "how this experience could help"
  - "in an interview"                              # the closing the user does not want
  - "i would like to discuss"
  - "this matters for your role because"          # announces the link instead of making it
  - "it fits well with"
  - "this matters"
  - "this matches your"
  - "this is close to"
  - "which matters for"
  - "I would love to"                             # reads as desperate in a cover letter
  - "love to"                                      # also catches I'd love to / would love to
  - "eager to"
  - "excited to"
  - "would be thrilled"
  - "dream"
  - "please reach out whenever"
  - "Dear Hiring Team"                             # the greeting is always "Hello,"
  - "Dear Sir/Madam"
  - "To whom it may concern"
